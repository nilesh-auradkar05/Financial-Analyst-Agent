# Isolated Qdrant-only stack for local tests and development.
# It deliberately uses a DIFFERENT volume from the full stack; never mount the
# same Qdrant storage into two concurrently running Qdrant servers.
# docker compose -p financial-analyst-qdrant-test -f docker-compose.qdrant.yml up -d

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.2}
    ports:
      - "127.0.0.1:${QDRANT_STANDALONE_HTTP_PORT:-16333}:6333"
      - "127.0.0.1:${QDRANT_STANDALONE_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrant-test-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ": >/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

volumes:
  qdrant-test-data:
    name: qdrant-financial-analyst-standalone-test
