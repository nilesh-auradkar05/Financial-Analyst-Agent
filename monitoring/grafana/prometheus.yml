# PROMETHEUS CONFIGURATION

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Alpha Analyst API
  - job_name: 'alpha-analyst'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    # /metrics requires the API key; compose mounts it as a secret (never committed).
    authorization:
      credentials_file: /run/secrets/api_key
