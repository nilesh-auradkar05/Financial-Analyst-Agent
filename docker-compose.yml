# Financial Analyst local stack. Embeddings are Cohere Embed v5 fast on Microsoft Foundry.
# External-facing deployments should use TLS, authentication and a reverse proxy.

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    container_name: financial-analyst-agent-system-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_KEY: ${API_KEY:?Set a non-empty API_KEY in .env}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-opensearch}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set a real SEC_USER_AGENT with your contact details}
      LANGSMITH_TRACING:
      LANGSMITH_API_KEY:
      LANGSMITH_PROJECT:
      LANGCHAIN_TRACING: ${LANGCHAIN_TRACING:-true}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-alpha-analyst}
      AWS_BEARER_TOKEN_BEDROCK:
      AWS_BEARER_TOKEN:
      AWS_REGION:
      AWS_BEDROCK_MODEL:
      CLAUDE_LLM_MODEL:
      OPENAI_LLM_MODEL:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      AZURE_API_KEY:
      AZURE_PROJECT_ENDPOINT:
      AZURE_OPENAI_ENDPOINT:
      AZURE_FOUNDRY_MODEL:
      AZURE_FOUNDRY_JUDGE_MODEL:
      AZURE_FOUNDRY_SENTIMENT_MODEL:
      AZURE_FOUNDRY_RERANK_MODEL:
      EMBEDDING_PROVIDER:
      EMBEDDING_MODEL:
      EMBEDDING_DIMENSIONS:
      LLM_TEMPERATURE:
      LLM_MAX_TOKENS:
      LLM_REQUEST_TIMEOUT_SECONDS:
      LLM_THINKING_MODE:
      LLM_THINKING_BUDGET_TOKENS:
      LLM_THINKING_EFFORT:
    volumes:
      - filings-data:/app/data/filings
      - runs-data:/app/.runtime
    # Mirrors Dockerfile HEALTHCHECK.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=8).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [financial-analyst-network]

  frontend:
    container_name: financial-analyst-agent-system-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      ALPHA_API_URL: http://api:8000
      API_KEY: ${API_KEY:?Set a non-empty API_KEY in .env}
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [financial-analyst-network]

  opensearch:
    container_name: opensearch-financial-analyst-agent-system
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.19.2}
    # Security plugin disabled: no host port is published, so only this network reaches it.
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    networks: [financial-analyst-network]

  prometheus:
    container_name: financial-analyst-agent-system-prometheus
    # Existing pinned version preserved; schedule tested security upgrades.
    image: prom/prometheus:v2.47.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - api_key
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    networks: [financial-analyst-network]

  grafana:
    container_name: financial-analyst-agent-system-grafana
    # Existing pinned version preserved; schedule tested security upgrades.
    image: grafana/grafana:10.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - prometheus
    networks: [financial-analyst-network]

secrets:
  # Kept for the existing Prometheus configuration; verify that it is read.
  api_key:
    environment: API_KEY

# External: these volumes outlive the stack and `down -v` cannot delete them.
# `make docker-up` creates any that are missing.
volumes:
  filings-data:
    name: financial-analyst-filings
    external: true
  runs-data:
    name: financial-analyst-runs
    external: true
  prometheus-data:
    name: financial-analyst-prometheus
    external: true
  grafana-data:
    name: financial-analyst-grafana
    external: true
  opensearch-data:
    name: financial-analyst-opensearch
    external: true

networks:
  financial-analyst-network:
    name: financial-analyst-network
    driver: bridge
