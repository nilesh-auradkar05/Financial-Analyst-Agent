# Financial Analyst Agent System - Docker Compose

# Usage:
  # docker compose up -d         # Start all services
  # docker compose logs -f api   # view API logs
  # docker compose down          # Stop all services
services:
  # Main API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-analyst-agent-system-api
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-}
      # Ollama connection
      # Host Ollama (override here if needed)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-qwen3-embedding:4b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}

      # Retrieval backend (service DNS, not container-local localhost)
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}

      # Tavily
      - TAVILY_API_KEY=${TAVILY_API_KEY}

      # ChromaDB
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-sec_filings}
      
      # SEC
      - SEC_USER_AGENT=${SEC_USER_AGENT:-AlphaAnalyst/1.0 (contact@example.com)}
      
      # LangSmith (optional)
      # Pass through modern names only when supplied; preserve legacy aliases below.
      - LANGSMITH_TRACING
      - LANGSMITH_API_KEY
      - LANGSMITH_PROJECT
      - LANGCHAIN_TRACING=${LANGCHAIN_TRACING:-true}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-alpha-analyst}

      # Chat: Bedrock primary (AWS_BEDROCK_MODEL), then personal Claude
      # (CLAUDE_LLM_MODEL + ANTHROPIC_API_KEY), then OpenAI (OPENAI_LLM_MODEL + OPENAI_API_KEY).
      # Optional pass-through preserves defaults and the bearer-token alias.
      - AWS_BEARER_TOKEN_BEDROCK
      - AWS_BEARER_TOKEN
      - AWS_REGION
      - AWS_BEDROCK_MODEL
      - CLAUDE_LLM_MODEL
      - OPENAI_LLM_MODEL
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      # Azure invocation is deferred (S7-AZURE-FALLBACK); configuration is reserved.
      - AZURE_API_KEY
      - AZURE_PROJECT_ENDPOINT
      - AZURE_OPENAI_ENDPOINT
      - AZURE_FOUNDRY_MODEL
      # Generation tuning (all chat attempts)
      - LLM_TEMPERATURE
      - LLM_MAX_TOKENS
      - LLM_REQUEST_TIMEOUT_SECONDS
      - LLM_THINKING_MODE
      - LLM_THINKING_BUDGET_TOKENS
      - LLM_THINKING_EFFORT

    volumes:
      # Persist data between restarts
      - chroma-data:/app/data/chroma
      - filings-data:/app/data/filings
      # Run history (jobs, memos, progress) survives image rebuilds
      - runs-data:/app/.runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - financial-analyst-network
    depends_on:
      qdrant:
        condition: service_healthy
    # For Mac/Windows to access host's ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Web UI -> http://localhost:3001 (Grafana holds host port 3000)
  frontend:
    build:
      context: ./frontend
    container_name: financial-analyst-agent-system-frontend
    ports:
      - "3001:3000"
    environment:
      # Server-side only; the browser never talks to the API directly.
      - ALPHA_API_URL=http://api:8000
      - API_KEY=${API_KEY:-}
    restart: unless-stopped
    networks:
      - financial-analyst-network
    depends_on:
      api:
        condition: service_healthy

  # Default retrieval backend
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-financial-analyst-agent-system
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - financial-analyst-network

  # Ollama Service (Optional if want to add ollama in docker)
  # =========================================================================
  # Uncomment this if you want to run Ollama in Docker instead of on host
  # Note: Requires GPU passthrough for good performance
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: financial-analyst-agent-system-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
    # For GPU support (NVIDIA), re-enable the deploy block below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # networks:
    #   - financial-analyst-network
  # =========================================================================

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: financial-analyst-agent-system-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - api_key
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped
    networks:
      - financial-analyst-network

  # Grafana
  grafana:
    image: grafana/grafana:10.2.0
    container_name: financial-analyst-agent-system-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - financial-analyst-network
    depends_on:
      - prometheus

secrets:
  # Same key the API enforces; read from API_KEY in the shell or .env.
  api_key:
    environment: API_KEY

volumes:
  chroma-data:
    name: financial-analyst-chroma
  filings-data:
    name: financial-analyst-filings
  runs-data:
    name: financial-analyst-runs
  prometheus-data:
    name: financial-analyst-prometheus
  grafana-data:
    name: financial-analyst-grafana
  qdrant-data:
    name: qdrant-financial-analyst-agent-system
  # ollama-data:
  #   name: financial-analyst-ollama

networks:
  financial-analyst-network:
    name: financial-analyst-network
    driver: bridge