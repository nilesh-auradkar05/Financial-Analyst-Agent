name: CI

on:
  push:
  pull_request:
    branches: [main]

# Least privilege: no job needs to write to the repo.
permissions:
  contents: read

jobs:
  # S2-T00a / G11: every governance rule the repo claims is enforced here.
  # Stdlib-only scripts, so no dependency install is needed.
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run governance checks
        run: |
          python scripts/ci/check_no_scope_residue.py
          python scripts/ci/check_sprint_map.py
          python scripts/ci/check_doc_sync.py
          python scripts/ci/check_test_hygiene.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group api --group dev

      - name: Run linter
        run: uv run ruff check .

      - name: Run type checker
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest tests/ tests/unit/ tests/integration/ -v --tb=short
